<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بەرگی پشتی و بەرگی سەرین - ئاسیان الزەهەبی</title>

<style>
body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#111;
color:white;
text-align:center;
}

header{
padding:25px 15px;
border-bottom:2px solid #d4af37;
background:#000;
}

h1,h2{
color:#d4af37;
}

.gallery{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
padding:15px;
max-width:1200px;
margin:auto;
}

.gallery img{
width:100%;
height:230px;
object-fit:cover;
border-radius:12px;
border:1px solid #d4af37;
}

.category{
margin:35px auto 15px;
padding:10px;
background:#000;
border:2px solid #d4af37;
border-radius:12px;
max-width:1100px;
}

.back{
display:inline-block;
margin:25px;
padding:12px 25px;
background:#d4af37;
color:#111;
text-decoration:none;
border-radius:10px;
font-weight:bold;
}

@media(min-width:700px){
.gallery{
grid-template-columns:repeat(4,1fr);
}
}
</style>
</head>

<body>

<header>
<h1>کۆمپانیای ئاسیان الزەهەبی</h1>
<p>بەرگی پشتی و بەرگی سەرین</p>
</header>


<!-- بەرگی پشتی -->

<div class="category">
<h2>بەرگی پشتی</h2>
</div>

<div class="gallery">

<!-- وێنەکانی بەرگی پشتی لێرە زیاد دەکرێن -->

</div>


<!-- بەرگی سەرین -->

<div class="category">
<h2>بەرگی سەرین</h2>
</div>

<div class="gallery">

<!-- وێنەکانی بەرگی سەرین لێرە زیاد دەکرێن -->

</div>


<a class="back" href="index.html">
گەڕانەوە بۆ سەرەکی
</a>

</body>
</html>
